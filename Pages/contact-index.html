<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Wasi</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #0f172a, #161f42);
            color: #fff;
        }
        .page-shell {
            width: min(95%, 720px);
            padding: 2rem;
            text-align: center;
            backdrop-filter: blur(16px);
            background: rgba(8, 12, 36, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.32);
        }
        h1 { font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 1rem; color: #dce5ff; text-shadow: 0 0 18px rgba(0,47,255,0.25); }
        p { color: #cbd5e1; line-height: 1.8; margin-bottom: 1.75rem; }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.4rem;
            background: #002fff;
            color: #fff;
            border-radius: 999px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 30px rgba(0, 47, 255, 0.25);
        }
        a:hover { transform: translateY(-2px); box-shadow: 0 18px 38px rgba(0, 47, 255, 0.35); }
    </style>
</head>
<body>
    <div class="page-shell">
        <h1>Contact Section Coming Soon</h1>
        <p>I’m preparing a fast, accessible contact page so visitors can easily reach you by email or social media.</p>
        <a href="../index.html">Return Home</a>
    </div>
</body>
</html>
