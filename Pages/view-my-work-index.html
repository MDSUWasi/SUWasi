<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="ddd814d8-a013-4739-82ca-ea23c8674274"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View my works and achievements across academic, personal, and project categories.">
    <title>View My Works and Achievements</title>
    <link rel="stylesheet" href="CSS/view-my-work-style.css">
</head>
<body>
    <header class="top-bar">
        <nav class="glass-nav">
            <a href="../index.html" class="nav-btn active" onclick="setSection('home')">Home</a>
            <a href="../Pages/about-index.html" class="nav-btn" onclick="setSection('about')">About</a>
            <div class="spacer"></div>
            <button class="icon-only" aria-label="More options">⋮</button>
        </nav>
    </header>

    <div class="main-container">
        <aside class="sidebar-left">
            <ul class="menu-list">
                <li class="active" onclick="filterCategory('all', event)"><span>📚 Dashboard</span></li>
                <li onclick="filterCategory('academic', event)"><span>🎓 Academic</span></li>
                <li onclick="filterCategory('personal', event)"><span>❤️ Personal</span></li>
                <li onclick="filterCategory('projects', event)"><span>💻 Projects</span></li>
                <li onclick="filterCategory('impacts', event)"><span>🌍 Impact</span></li>
            </ul>
            <div class="user-profile-mini">
                <div class="avatar"></div>
                <div class="profile-info">
                    <strong>Md. Shafi Un Wasi</strong>
                    <small>Work Showcase</small>
                </div>
            </div>
        </aside>

        <main class="content-area">
            <h2 id="section-title">All Achievements</h2>
            <div class="grid-cards" id="cards-grid"></div>
        </main>

        <aside class="sidebar-right" id="detail-panel">
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">⭐</div>
                <p>Select a card to view details</p>
            </div>
            <div class="item-details" id="details-content" style="display:none;">
                <div class="detail-icon-wrapper" id="d-icon"></div>
                <h3 id="d-title">Title</h3>
                <span class="tag" id="d-category">Category</span>
                <div class="date-badge" id="d-date">Date</div>
                <p class="description" id="d-desc">Description goes here...</p>
                <div class="actions">
                    <button class="btn-primary">View Proof</button>
                    <button class="btn-secondary">Share</button>
                </div>
            </div>
        </aside>
    </div>

    <script src="JavaScript/view-my-work-script.js"></script>
</body>
</html>
