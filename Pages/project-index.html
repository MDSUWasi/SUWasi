<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Wasi</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #0b1223, #16386e);
            color: #fff;
        }
        .page-shell {
            width: min(95%, 720px);
            padding: 2rem;
            text-align: center;
            backdrop-filter: blur(12px);
            background: rgba(5, 18, 55, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
        }
        h1 { font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 1rem; }
        p { color: #cbd5e1; line-height: 1.8; margin-bottom: 1.75rem; }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.4rem;
            background: #ff2c07;
            color: #fff;
            border-radius: 999px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        a:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(255, 44, 7, 0.35); }
    </style>
</head>
<body>
    <div class="page-shell">
        <h1>Projects Page Coming Soon</h1>
        <p>I am building this page to highlight your best work in a fast and polished layout with clear project details.</p>
        <a href="../index.html">Return Home</a>
    </div>
</body>
</html>
